<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雷犀客服管理系统</title>
    <link rel="icon" type="image/x-icon" href="./icons/logo.ico">
    <style>
      /* 雷犀旗舰版尊享启动页面样式 */
      body { margin: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      
      #preloader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loader-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* 核心旋转光环 */
      .loader-ring {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 2px solid #f1f5f9;
        border-top: 2px solid #2563eb;
        animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      /* Logo 呼吸动画 */
      .loader-logo {
        width: 72px;
        height: 72px;
        z-index: 10;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.05));
        animation: breath 3s ease-in-out infinite;
      }

      /* 文字排版优化 */
      .loader-info {
        margin-top: 64px;
        text-align: center;
        animation: fadeInUp 0.8s ease-out;
      }

      .loader-title {
        font-size: 20px;
        font-weight: 600;
        color: #1e293b;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }

      .loader-subtitle {
        font-size: 13px;
        color: #94a3b8;
        font-weight: 400;
        letter-spacing: 1px;
      }

      /* 动画定义 */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes breath {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* 响应式适配 */
      @media (max-width: 640px) {
        .loader-ring { width: 110px; height: 110px; }
        .loader-logo { width: 56px; height: 56px; }
        .loader-title { font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <!-- 尊享版首屏加载器 -->
    <div id="preloader">
      <div class="loader-container">
        <div class="loader-ring"></div>
        <img src="./icons/logo.ico" class="loader-logo" alt="Leixi Logo">
      </div>
      <div class="loader-info">
        <div class="loader-title">雷犀客服管理系统</div>
        <div class="loader-subtitle">系统正在启动中...</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // 优雅移除逻辑
      window.addEventListener('load', function() {
        const preloader = document.getElementById('preloader');
        if (preloader) {
          // 增加一个极短的延迟，确保页面渲染完成后的视觉连贯性
          setTimeout(() => {
            preloader.style.opacity = '0';
            setTimeout(() => preloader.remove(), 800);
          }, 200);
        }
      });
    </script>
  </body>
</html>
