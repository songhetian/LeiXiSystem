# 雷犀管理系统 · 内网灰度 nginx 反代
# /api/v1    → backend:4001（后端全局前缀 api/v1 匹配）
# /ws        → backend:4001（Socket.IO WebSocket，升级连接）
# /          → frontend:4000（next start）

# 速率限制 zone：按客户端 IP 限制，10MB 内存，每秒 10 请求
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    # 安全响应头（始终追加，即便代理返回错误）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Socket.IO WebSocket 升级
    location /ws/ {
        proxy_pass http://backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }

    # 后端 API
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # XFace600 Push 端点（无 /api/v1 前缀）
    # 生产环境应配置 IP 白名单，限制仅考勤机网段可访问，例如：
    #   allow 192.168.1.0/24;
    #   deny  all;
    location /iclock/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 指标端点
    # 收口方式：IP 白名单（不引入 JWT —— 抓取端无法携带业务凭据）。
    # 注意：nginx 的 allow/deny 按书写顺序匹配，deny all 必须在所有 allow 之后。
    # 容器间抓取（同 compose 网络）来源为 172.16.0.0/12；宿主机直连为 127.0.0.1。
    # 用精确匹配（=）把白名单面收窄到唯一路径，不放行 /metrics 子路径。
    # proxy_pass 必须带上后端全局前缀：后端 setGlobalPrefix('api/v1')，
    # MetricsController 的真实路径是 /api/v1/metrics；只写到 backend:4001 会把
    # /metrics 原样透传，匹配不到任何路由（实测返回 4000 参数校验失败）。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend:4001/api/v1/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}