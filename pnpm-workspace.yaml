packages:
  - "backend"
  - "frontend"
  - "shared"
minimumReleaseAgeExclude:
  - framer-motion@13.1.1
  - motion-dom@13.1.1
# pnpm 11 安全策略：放行需要 postinstall 构建脚本的依赖
onlyBuiltDependencies:
