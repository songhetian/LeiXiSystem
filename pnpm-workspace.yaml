packages:
  - "backend"
  - "frontend"
  - "shared"
minimumReleaseAgeExclude:
  - framer-motion@13.1.1
  - motion-dom@13.1.1
# pnpm 11 安全策略：放行需要 postinstall 构建脚本的依赖
# 注意：v10 的 onlyBuiltDependencies 已在 v11 被移除且被静默忽略，
# 而 strictDepBuilds 默认转为 true —— 继续用旧键会让 install 直接
# ERR_PNPM_IGNORED_BUILDS 退出 1（Docker 构建即卡在这一步）。必须用 allowBuilds。
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  "@swc/core": true
  esbuild: true
  msw: true
  prisma: true
