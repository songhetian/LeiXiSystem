# 雷犀管理系统 · 本地 Docker 一键启动（T30 本地测试版）
# 端口分配（全部避开本机已占用端口）：
#   nginx 入口  8088（本机 8080 被 maxkb 占用）
#   backend     容器内 3001，宿主映射 3102（本机 3001 被 leixi-kf 占用）
#   mysql       容器内 3306，宿主映射 3307（本机 3306 为本地 MySQL）
# 访问：http://localhost:8088
services:
  mysql:
    image: mysql:8.0
    container_name: leixi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: leixin_v2
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - leixi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leixi-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://root:root123456@mysql:3306/leixin_v2"
      JWT_SECRET: "leixi-dev-secret-2026"
      # 未设置 REDIS_URL → Redis 降级 no-op，本地测试无需 Redis
    ports:
      - "3102:3001"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: leixi-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: "http://backend:3001/api/v1/:path*"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: leixi-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  leixi-mysql-data:
