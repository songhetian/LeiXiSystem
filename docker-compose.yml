# 雷犀管理系统 · Docker 一键部署（开发/生产）
# 密钥从项目根目录 .env 文件读取（docker-compose 自动加载，勿提交真实 .env）
# 生产环境部署：
#   docker compose --env-file .env.production up -d --build
#
# 端口分配：
#   nginx 入口  8088（宿主机访问入口）
#   backend     容器内 4001（nginx 已做反代，默认不暴露到宿主机）
#   frontend    容器内 4000
#   mysql       容器内 3306（仅内网通信）
#   redis       容器内 6379（仅内网通信）
# 访问：http://localhost:8088

services:
  mysql:
    image: mysql:8.0
    container_name: leixi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leixin_v2}
      TZ: Asia/Shanghai
    # 开发调试时可取消下方注释，将 3306 暴露到宿主机 3307
    # ports:
    #   - "3307:3306"
    volumes:
      - leixi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: leixi-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-redis-password}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: leixi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # 监听端口：必须显式传入。main.ts 的兜底是 3001，而本文件/nginx/healthcheck/
      # frontend 的 API_PROXY_TARGET 全部按 4001 对接，不传会导致容器起得来但
      # 4001 无监听（nginx 502、健康检查永远不通过，frontend/nginx 因
      # depends_on: service_healthy 永远不启动）。
      PORT: ${PORT:-4001}
      # 是否在容器启动时执行种子数据（幂等演示数据）。默认 false：
      # 生产库一旦有真实数据，绝不能被种子脚本覆盖，需要时显式置 true。
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      # 文件存储驱动：local = 容器内磁盘（本地部署），oss = 阿里云 OSS（生产）。
      # 必须显式传入，否则 .env.production 的 FILE_STORAGE=oss 不会生效。
      FILE_STORAGE: ${FILE_STORAGE:-local}
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-leixin_v2}"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8088,http://localhost:4000}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-change-me-redis-password}@redis:6379"
      # 阿里云 OSS（对象存储）
      OSS_REGION: ${OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY}
      OSS_ACCESS_SECRET: ${OSS_ACCESS_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
    # nginx 已做反代，默认不直接暴露 backend；开发调试可取消下方注释
    # ports:
    #   - "4102:4001"
    volumes:
      # 挂到后端实际写入路径：local-storage.driver 用 resolve(process.cwd(), 'uploads')，
      # 而容器 WORKDIR 是 /app/backend → 无此挂载时上传文件会落在容器可写层，重建即丢。
      - leixi-uploads:/app/backend/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/api/v1/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: leixi-frontend
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: "http://backend:4001"
    # nginx 已做反代，默认不直接暴露 frontend；开发调试可取消下方注释
    # ports:
    #   - "4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: leixi-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      # 注意：这里不再挂载 leixi-uploads。文件访问统一走后端
      # /api/v1/files 接口（nginx.local.conf 并无 /uploads/ location），
      # 挂载只会得到一个空目录。
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # 必须写 127.0.0.1：busybox wget 解析 localhost 会优先取 ::1，
      # 而 nginx 的 `listen 80` 只监听 IPv4 0.0.0.0:80 → 容器永远 unhealthy。
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  leixi-mysql-data:
  leixi-uploads: